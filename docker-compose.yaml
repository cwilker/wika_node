# A single development node: Alice authors blocks and verifies URL ownership.
#   docker compose up --build
# RPC (HTTP and WebSocket) on ws://127.0.0.1:9944
services:
  wika:
    build: .
    image: wika-node:latest
    ports:
      - 30333:30333
      - 9944:9944
    command: --dev --rpc-external --rpc-cors=all
